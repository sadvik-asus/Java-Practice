<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>farmer-signin-form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header align="center">
        <h1>Fruits and Flowers</h1>
        <h2>Farmer sign in page</h2>
        <nav align="center">
            <a href="home.html">Home</a> &nbsp;&nbsp;
            <a href="flowers.html">Flowers</a> &nbsp;&nbsp;
            <a href="fruits.html">Fruits</a> &nbsp;&nbsp;
            <a href="gallery.html">Gallery</a> &nbsp;&nbsp;
            <a href="FarmerSignup.html">Farmer SignUp</a> &nbsp;&nbsp;
            <a href="#">Farmer SignIn</a> &nbsp;&nbsp;
            <a href="usersignup.html">User SighUp</a> &nbsp;&nbsp;
            <a href="usersignin.html">User SignIn</a> &nbsp;&nbsp;
        </nav>
    </header>
    <hr>
    <main>
        <center>
            <h2>Farmer Login</h2>

            <form action="#" method="post">
                <table cellpadding="8" cellspacing="5" border="1">
                    <tr>
                        <td align="right"><label for="farmerId">Email or Phone:</label></td>
                        <td><input type="text" id="farmerId" name="farmerId" required placeholder="Email or Phone number"></td>
                    </tr>
                    <tr>
                        <td align="right"><label for="pwd">Password:</label></td>
                        <td><input type="password" id="pwd" name="password" required placeholder="Enter password"></td>
                    </tr>
                    <tr>
                        <td align="center" colspan="2">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember me</label>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" colspan="2">
                            <input type="submit" value="Sign In">
                            &nbsp;&nbsp;
                            <input type="reset" value="Clear">
                        </td>
                    </tr>
                </table>
            </form>

            <p>Don't have a farmer account? <a href="FarmerSignup.html">Register here</a></p>
        </center>
    </main>
    <hr>
    <footer>
        <h4 align="center">Copyrights - @ Mr.Innocent</h4>
    </footer>
</body>
</html>
