    <main>
        <center>
            <h2>Customer Sign In</h2>

            <form action="#" method="post">
                <table cellpadding="8" cellspacing="5" border="1">
                    <tr>
                        <td align="right"><label for="login-email">Email or Mobile:</label></td>
                        <td><input type="text" id="login-email" name="loginId" required placeholder="Enter email or mobile"></td>
                    </tr>
                    <tr>
                        <td align="right"><label for="login-pwd">Password:</label></td>
                        <td><input type="password" id="login-pwd" name="password" required placeholder="Enter your password"></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="checkbox" id="remember" name="rememberMe">
                            <label for="remember">Remember me</label>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" colspan="2">
                            <input type="submit" value="Sign In">
                            &nbsp;&nbsp;
                            <input type="reset" value="Clear">
                        </td>
                    </tr>
                </table>
            </form>

            <br>
            <p>Don't have an account? <a href="usersignup.html">Create a New Account</a></p>
