<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 4 : on 11/09/2026</title>
</head>
<body bgcolor="lightblue">
    <header>
        <h1>
            <center>ELLENKI COLLEGE OF ENGINEERING AND TECHNOLOGY</center>
        </h1>
        <nav align="center">
            <a href="home.html">Home</a> &nbsp;&nbsp;
            <a href="faculties.html">CSE Faculties</a>&nbsp;&nbsp;
            <a href="subbranches.html">Sub Branches</a>&nbsp;&nbsp;
            <a href="placedstudents.html">Placed Students</a>&nbsp;&nbsp;
            <a href="#">Student Sighnup Form</a>&nbsp;&nbsp;
        </nav>
    </header>
    <hr>
    <main>
        <section>
            <center>
                <h4>Signup form</h4>
            </center>
            <form>
                <table bgcolor="cyan" border="4px" align="center">
                    <tr>
                        <td>
                            <label>First Name : </label>
                        </td>
                        <td>
                            <input type="text">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Last Name : </label>
                        </td>
                        <td>
                            <input type="text">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Email : </label>
                        </td>
                        <td>
                            <input type="email">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Password : </label>
                        </td>
                        <td>
                            <input type="password">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Date of Birth : </label>
                        </td>
                        <td>
                            <input type="date">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Gener : </label>
                        </td>
                        <td>
                           <input type="radio" name="Male" id="Male">Male
                           <input type="radio" name="Female" id="Female">Female
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Language : </label>
                        </td>
                        <td>
                            <input type="checkbox" value="Telugu">Telugu
                            <input type="checkbox" value="Hindi">Hindi
                            <input type="checkbox" value="English">English
                        </td>
                    </tr>
                    <tr>
                        <td>
                             <label>Qualification</label>
                        </td>
                        <td>
                           <select>
                            <option>Select Degree</option>
                            <option value="UG">UG</option>
                            <option value="PG">PG</option>
                            <option value="PhD">Phd</option>
                           </select>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Mobile</label>
                        </td>
                        <td>
                            <input type="tel">
                        </td>
                    </tr>
                     <tr>
                        <td>
                            <label>Age</label>
                        </td>
                        <td>
                            <input type="number">
                        </td>
                    </tr>
                    <tr>
                        <td>    
                            <label>Address</label>
                        </td>
                        <td>
                            <textarea role="10" cols="15"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <input type="submit">
                        </td>
                        <td>
                             <input type="reset">
                        </td>
                    </tr>

                </table>
            </form>
        </section>

    </main>
    <hr>
    <footer>
        <h5>
            <center>
                Get the latest updates, happenings and announcements all in real time.
            </center>
        </h5>
    </footer>
</body>
</html>
