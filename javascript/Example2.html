<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function doSum(a,b){
            var result
            result = a + b
            document.write(result,"\n")
        }

        function areaOfCircle(radius){
            const PI = 3.1415
            var result = (PI * radius * radius)
            document.write(result,"\n")
        }

        doSum(50,20)
        document.write("\n")
        areaOfCircle(12)
    </script>
</body>
</html>
